<style>
/* Layout: one screen, three bands. The pony's speech bubble on top, the pony in her room in the middle,
   a shelf of big things to tap at the bottom. Nothing to read: every tap speaks Turkish. */
:root{
  --wall:#f4e6ff; --wall-2:#ead4fb; --floor:#ffd3e6; --paper:#fffaf3; --ink:#3b1f4a; --soft:#8a6f96;
  --berry:#e8418a; --mint:#7fd8c3; --sun:#ffd166; --coat:#fff6fb; --coat-far:#f0d9ee; --hair:#ff7fbf; --hair-wet:#d95a9c; --hoof:#c9a7ff;
  --font:'Baloo 2','Trebuchet MS','Segoe UI',sans-serif;
  --font-small:'Nunito','Segoe UI',sans-serif;
  color-scheme:light;
}
/* each room has its own walls and floor */
body[data-room="butik"]{--wall:#ffeadd;--wall-2:#ffdccb;--floor:#e6d5ff}
body[data-room="havuz"]{--wall:#dff4ff;--wall-2:#c8eaff;--floor:#ffe7b3}
body[data-room="pastane"]{--wall:#e6f8ee;--wall-2:#d2f0df;--floor:#ffe0cf}
body[data-room="yemek"]{--wall:#fff3d6;--wall-2:#ffe8bd;--floor:#d9efc2}
body[data-room="gezinti"]{--wall:#dff4ff;--wall-2:#cfecff;--floor:#bfe8a6}   /* outdoors: sky and grass */
body.ride #app{animation:roll 1.1s linear infinite}                           /* the world rolls past while she trots */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--font);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding-block:10px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,var(--floor) 0 27%,transparent 27%),repeating-linear-gradient(90deg,var(--wall) 0 44px,var(--wall-2) 44px 88px)}

/* the speech bubble */
#top{display:flex;align-items:center;gap:10px;min-width:0}
#bubble{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:var(--paper);border:4px solid var(--ink);border-radius:26px;
  padding:6px 16px 6px 8px;box-shadow:0 5px 0 var(--ink);min-height:68px}
#again{flex:none;width:54px;height:54px;border-radius:50%;background:var(--sun);border:4px solid var(--ink);display:grid;place-items:center}
#again svg{width:28px;height:28px}
#again:active{transform:translateY(2px)}
#words{min-width:0;display:flex;flex-direction:column;line-height:1.05}
#word{font-weight:800;font-size:clamp(1.5rem,5.2vw,2.7rem);text-wrap:balance;overflow-wrap:anywhere}
#gloss{font-family:var(--font-small);font-weight:700;font-size:.82rem;color:var(--soft);letter-spacing:.02em}
#steps{flex:none;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:34%}
#steps i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
#steps i.done{background:var(--berry)}
#steps i.now{background:var(--sun)}

/* the room */
#stage{position:relative;min-height:0;overflow:hidden}
#pony{position:absolute;inset:0;width:100%;height:100%;display:block}   /* fills the middle band and never spills onto the shelf */
#tag{position:absolute;left:0;top:0;max-width:60%;background:var(--berry);color:#fff;font-weight:800;font-size:clamp(.95rem,2.6vw,1.3rem);
  border:4px solid var(--ink);border-radius:999px;padding:2px 16px;box-shadow:0 4px 0 var(--ink);overflow-wrap:anywhere;text-align:left}
#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:confetti 2.6s linear forwards}

.ol{fill:var(--ink);stroke:var(--ink);stroke-width:9;stroke-linejoin:round}
.fl{fill:var(--coat)}
.far rect{fill:var(--coat-far);stroke:var(--ink);stroke-width:4.5}
.hoof{fill:var(--hoof);stroke:var(--ink);stroke-width:4}
.hair{fill:var(--hair);stroke:var(--ink);stroke-width:4.5;stroke-linejoin:round}
.hair.wet{fill:var(--hair-wet)}
.strand{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.75}
.sud{fill:#fff;stroke:#9fd8ff;stroke-width:2.5}
.line{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.acc{stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
.off{display:none}
/* what shows for each state of her mane, and for each room */
#pony [data-m],#pony [data-r]{display:none}
#pony[data-mane="messy"] [data-m~="messy"],#pony[data-mane="wet"] [data-m~="wet"],#pony[data-mane="soapy"] [data-m~="soapy"],
#pony[data-mane="combed"] [data-m~="combed"],#pony[data-mane="fluffy"] [data-m~="fluffy"],
#pony[data-room="havuz"] [data-r~="havuz"],#pony[data-room="pastane"] [data-r~="pastane"]{display:inline}
#pony .front-water{display:none}
#pony.swim .front-water{display:inline}
#pony.swim #shadow{display:none}
/* where she stands: the middle, or to the left when there is a pool or a table beside her, or in the water */
#ponywrap{transform:translate(70px,0);transition:transform .7s cubic-bezier(.3,.7,.3,1)}
#pony[data-room="havuz"] #ponywrap,#pony[data-room="pastane"] #ponywrap{transform:translate(0,0)}
#pony[data-room="havuz"].swim #ponywrap{transform:translate(110px,72px)}
#bounce,#eye,#suds circle,#fx *,#fx2 *,#bowl,#flame,#chomp,.bobber{transform-box:fill-box;transform-origin:center}
#bounce{animation:bob 2.6s ease-in-out infinite}
#pony.ride #bounce{animation:bob .34s ease-in-out infinite}
#chomp{display:none}
#pony.chomp #smile{display:none}
#pony.chomp #chomp{display:inline;animation:munch .22s ease-in-out 5 alternate}
#bounce.jump{animation:jump .5s ease-out}
#bounce.twirl{animation:twirl 1.1s ease-in-out}
#eye{animation:blink 4.2s infinite}
#suds circle{animation:sud 1.6s ease-in-out infinite alternate}
#suds circle:nth-child(2n){animation-delay:-.7s}
#bowl.stir{animation:wobble .3s 3}
#flame{animation:flame .5s ease-in-out infinite alternate}
.bobber{animation:bob 1.8s ease-in-out infinite}
.fx-bub{animation:floatup 1.5s ease-out forwards}
.fx-drop{animation:fall .9s ease-in forwards}
.fx-spark{animation:pop .9s ease-out forwards}
.fx-snip{animation:snip 1.2s ease-in forwards}

/* the shelf */
#shelf{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(10px,3vw,26px);min-height:clamp(104px,24vmin,180px);
  background:var(--paper);border:4px solid var(--ink);border-radius:28px;padding:10px 12px;box-shadow:0 5px 0 var(--ink)}
.pick{width:clamp(84px,20vmin,150px);aspect-ratio:1;background:#fff;border:4px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);
  display:grid;place-items:center;padding:8px;transition:transform .12s}
.pick svg{width:100%;height:100%;pointer-events:none}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pick.right{background:#d9f7e8}
.pick.wobble{animation:wobble .5s}
.pick.hint{background:#fff3c4;animation:hint 1s ease-in-out infinite}
.pick:disabled{cursor:default}
.go{width:clamp(96px,22vmin,150px);aspect-ratio:1;border-radius:50%;background:var(--berry);border:5px solid var(--ink);box-shadow:0 7px 0 var(--ink);display:grid;place-items:center}
.go svg{width:52%;height:52%}
.go.small{width:clamp(72px,16vmin,110px);background:var(--mint)}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.go:disabled{background:#d9cbe0;box-shadow:0 3px 0 var(--ink);cursor:default}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:4px solid var(--ink);border-radius:999px;padding:4px 16px 4px 10px;box-shadow:0 5px 0 var(--ink);
  font-weight:800;font-size:clamp(1rem,3vw,1.35rem);min-height:52px}
.chip span{font-size:1.5em;line-height:1}
.chip:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.chip.on{background:var(--berry);color:#fff}
.ghost{position:fixed;z-index:20;pointer-events:none}
.pick{position:relative}
.pick.star::after,.sec.full .head::after{content:"⭐";position:absolute;top:-12px;right:-10px;font-size:1.6rem;line-height:1}
.go.pulse{animation:hint 1s ease-in-out infinite}

/* the sticker book: a page over the whole game, one box per room, a sticker for every word she has found */
#album{position:fixed;inset:0;z-index:30;background:var(--wall);display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#albumtop{display:flex;align-items:center;gap:12px;min-width:0}
#albumtop .go{flex:none;width:64px;background:var(--berry)}
#albumsay{flex:1;min-width:0;background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:4px 14px;min-height:60px;
  display:flex;flex-direction:column;justify-content:center;line-height:1.05}
#albumword{font-weight:800;font-size:clamp(1.3rem,4.4vw,2.1rem);overflow-wrap:anywhere}
#albumgloss{font-family:var(--font-small);font-weight:700;font-size:.8rem;color:var(--soft)}
#albumcount{flex:none;font-weight:800;font-size:clamp(1.1rem,3.4vw,1.6rem);background:var(--sun);border:4px solid var(--ink);border-radius:999px;padding:2px 14px;box-shadow:0 4px 0 var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.sec{flex:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:12px;box-shadow:0 5px 0 var(--ink)}
.sticker{position:relative;aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px;display:grid;place-items:center}
.sticker svg{width:100%;height:100%;pointer-events:none}
.sticker.head{background:var(--sun);border-width:4px}
.sticker.locked{border-style:dashed;background:transparent}
.sticker.locked svg{filter:grayscale(1);opacity:.2}
.sticker.wobble{animation:wobble .5s}
.sticker:active{transform:translateY(2px)}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-30px) rotate(-3deg)}70%{transform:translateY(-6px)}}
@keyframes twirl{0%,100%{transform:scaleX(1)}25%{transform:scaleX(-1) translateY(-22px)}50%{transform:scaleX(1)}75%{transform:scaleX(-1) translateY(-22px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sud{from{transform:translateY(0) scale(1)}to{transform:translateY(-5px) scale(1.12)}}
@keyframes flame{from{transform:scale(1,1)}to{transform:scale(.85,1.15)}}
@keyframes munch{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
@keyframes roll{to{background-position:0 0,-88px 0}}
@keyframes floatup{from{transform:translateY(0) scale(.5);opacity:1}to{transform:translateY(-110px) scale(1.2);opacity:0}}
@keyframes fall{from{transform:translateY(-40px);opacity:1}to{transform:translateY(130px);opacity:0}}
@keyframes pop{0%{transform:scale(0) rotate(0);opacity:1}60%{transform:scale(1.2) rotate(40deg);opacity:1}100%{transform:scale(.6) rotate(70deg);opacity:0}}
@keyframes snip{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(170px) rotate(260deg);opacity:0}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes hint{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes confetti{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){#bounce,#pony.ride #bounce,body.ride #app,#eye,#suds circle,.pick.hint,#flame,.bobber{animation:none}#ponywrap{transition:none}}
</style>
<style>
/* Home screen build only: outside the artifact host nothing pads for the status bar and home indicator, so do it here. */
html.home-screen { background: var(--wall); }
html.home-screen body { margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>

<body>
<div id="app">
  <div id="top">
    <div id="bubble">
      <button id="again" aria-label="Tekrar söyle">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12h6l8-7v22l-8-7H4z" fill="#3b1f4a"/><path d="M22 11q4 5 0 10M25.5 7q7 9 0 18" fill="none" stroke="#3b1f4a" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
      <div id="words"><span id="word">Leyla'nın Midillisi</span><span id="gloss">Leyla's pony</span></div>
    </div>
    <div id="steps" aria-hidden="true"></div>
  </div>

  <div id="stage">
    <svg id="pony" viewBox="0 0 560 380" data-mane="combed" role="img" aria-label="Midilli">
      <defs>
        <g id="bodyshape">
          <rect x="104" y="262" width="28" height="86" rx="13"/><rect x="250" y="262" width="28" height="86" rx="13"/>
          <ellipse cx="188" cy="226" rx="100" ry="62"/>
          <path d="M236 192 Q246 130 286 100 L328 150 Q298 186 278 250 Z"/>
        </g>
        <g id="headshape">
          <ellipse cx="306" cy="114" rx="50" ry="43"/><ellipse cx="346" cy="134" rx="31" ry="25"/>
          <path d="M283 84 L290 38 L316 76 Z"/>
        </g>
        <path id="water" d="M122 268 q14 -10 28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 V380 H122 Z"/>
      </defs>

      <!-- the pool, behind her -->
      <g data-r="havuz">
        <use href="#water" fill="#6ec8ff"/>
        <rect x="112" y="258" width="14" height="122" rx="5" fill="#fff" stroke="#3b1f4a" stroke-width="3.5"/>
      </g>
      <!-- the bakery table, with whatever is on it -->
      <g data-r="pastane">
        <rect class="acc" x="398" y="282" width="13" height="72" rx="5" fill="#b9814a"/><rect class="acc" x="532" y="282" width="13" height="72" rx="5" fill="#b9814a"/>
        <rect class="acc" x="386" y="268" width="170" height="16" rx="7" fill="#d9a066"/>
        <g class="wear off" data-w="kase" id="bowl">
          <path class="acc" d="M424 226 H520 Q518 268 472 268 Q426 268 424 226 Z" fill="#7fd8c3"/>
          <ellipse class="acc" cx="472" cy="226" rx="48" ry="9" style="fill:var(--batter,#fffaf3)"/>
        </g>
        <g class="wear off" data-w="pasta">
          <ellipse class="acc" cx="472" cy="266" rx="70" ry="9" fill="#fff"/>
          <rect class="acc" x="426" y="204" width="92" height="60" rx="10" fill="#f2c27b"/>
          <path d="M428 236 H516" stroke="#e3a455" stroke-width="5"/>
        </g>
        <g class="wear off" data-w="mum">
          <rect class="acc" x="467" y="140" width="10" height="56" rx="3" fill="#ff8fc7"/><path d="M467 156l10-5M467 170l10-5" stroke="#fff" stroke-width="3"/>
          <path id="flame" class="acc" d="M472 114 q10 12 0 24 q-10 -12 0 -24z" fill="#ffb703"/>
        </g>
        <g class="wear off" data-w="krema"><path class="acc" d="M422 216 Q424 194 472 194 Q520 194 522 216 Q514 232 502 218 Q492 236 478 218 Q466 236 452 218 Q440 234 422 216 Z" fill="#fff7fb"/></g>
        <g class="wear off" data-w="cikolata"><path d="M434 206 q8 14 16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#7b4a2a" stroke-width="6" stroke-linecap="round"/></g>
        <g class="wear off" data-w="cilek">
          <path class="acc" d="M446 200 q-13 -10 -9 -21 q9 -5 18 0 q4 11 -9 21z" fill="#ef3b4d"/><path d="M439 180l7-6 7 6-7 3z" fill="#2fb86b"/>
          <path class="acc" d="M472 198 q-13 -10 -9 -21 q9 -5 18 0 q4 11 -9 21z" fill="#ef3b4d"/><path d="M465 178l7-6 7 6-7 3z" fill="#2fb86b"/>
          <path class="acc" d="M498 200 q-13 -10 -9 -21 q9 -5 18 0 q4 11 -9 21z" fill="#ef3b4d"/><path d="M491 180l7-6 7 6-7 3z" fill="#2fb86b"/>
        </g>
        <rect id="bowlspot" x="432" y="186" width="80" height="76" fill="none"/>
      </g>

      <!-- what they pass on a ride: the game adds each thing here as Leyla finds it -->
      <g id="sights"></g>

      <g id="ponywrap">
        <ellipse id="shadow" cx="190" cy="352" rx="132" ry="13" fill="#3b1f4a" opacity=".16"/>

    use(t) {
      if (t === 'eyer') { wear('eyer', true); wear('binici', true); burst('spark'); return 'fx_saddle'; }
      if (t === 'kask') { wear('kask', true); burst('spark'); return 'fx_helmet'; }
      sight(t); return ['fx_look', 'fx_wow', 'praise2'][S.worn++ % 3];
    },
    after(t) { if (t !== 'kask') return null; ride(true); return 'fx_ride'; } },
};
const ROOM_ORDER = ['kuafor', 'butik', 'havuz', 'pastane', 'yemek', 'gezinti'];

/* =====================================================================
   The game
   ===================================================================== */
const S = { mode: 'title', room: null, names: [], picking: [], visits: {}, steps: [], i: 0, wrong: 0, busy: false, worn: 0, last: [], found: new Set(), fresh: 0 };
const shelf = $('shelf');
function show(tr, en) { $('word').textContent = tr; $('gloss').textContent = en || ''; }
function setMode(m) { S.mode = m; document.body.dataset.mode = m; }
function fullName() { return S.names.map(id => nameOf[id].show).join(' '); }
function drawTag(ids) { const t = $('tag'); t.textContent = ids.map(id => nameOf[id].show).join(' '); t.hidden = !ids.length; }
function bigButton(icon, label, onTap, small) { const b = document.createElement('button'); b.className = 'go' + (small ? ' small' : ''); b.innerHTML = icon; b.setAttribute('aria-label', label); b.onclick = onTap; return b; }
function loadNames() { try { const v = JSON.parse(localStorage.getItem('lm-names') || '[]'); if (Array.isArray(v)) return v.map(id => (id === 'zooey' ? 'zoey' : id)).filter(id => nameOf[id]).slice(0, MAX_NAMES); } catch (e) {} return []; }
function saveNames() { try { localStorage.setItem('lm-names', JSON.stringify(S.names)); } catch (e) {} }

/* ---------- The sticker book: one sticker for every word Leyla has found, kept on this tablet ---------- */
function loadFound() { try { const v = JSON.parse(localStorage.getItem('lm-found') || '[]'); if (Array.isArray(v)) return new Set(v.filter(k => typeof k === 'string')); } catch (e) {} return new Set(); }
function saveFound() { try { localStorage.setItem('lm-found', JSON.stringify([...S.found])); } catch (e) {} }
// Getting a thing right earns its sticker. A colored thing also earns the color, a counted thing also earns the number.
function mark(target) {
  const v = variantOf(target), c = countOf(target), keys = v ? [v.base, 'renk-' + v.color.id] : c ? [c.base, 'sayi-' + c.n] : [target];
  let fresh = 0; keys.forEach(k => { if (!S.found.has(k)) { S.found.add(k); fresh++; } });
  if (fresh) { S.fresh += fresh; saveFound(); }
}
// The pages: one per room, then the colors, then the numbers. Each sticker: its key, its words, its picture, its voice clip.
function albumPages() {
  const pages = ROOM_ORDER.map(r => ({ key: 'room-' + r, tr: ROOMS[r].tr, en: ROOMS[r].en, pic: drawing(ROOMS[r].pic), clip: 'word/room-' + r,
    tiles: ITEMS.filter(i => i.r === r).map(i => ({ key: i.id, tr: i.tr, en: i.en, pic: drawing(i.id), clip: 'word/' + i.id })) }));
  pages[ROOM_ORDER.indexOf('kuafor')].tiles.push({ key: 'kurdele', tr: 'Kurdele', en: 'ribbon', pic: drawing('kurdele-pembe'), clip: 'word/kurdele' });
  pages[ROOM_ORDER.indexOf('butik')].tiles.unshift({ key: 'elbise', tr: 'Elbise', en: 'dress', pic: drawing('elbise-pembe'), clip: 'word/elbise' });
  pages.push({ key: 'renkler', tr: 'Renkler', en: 'colors', pic: palette, clip: 'word/renkler', tiles: COLORS.map(c => ({ key: 'renk-' + c.id, tr: c.tr, en: c.en, pic: swatch(c.hex), clip: 'word/renk-' + c.id })) });
  pages.push({ key: 'sayilar', tr: 'Sayılar', en: 'numbers', pic: numeral('123'), clip: 'word/sayilar', tiles: NUMBERS.map(x => ({ key: 'sayi-' + x.n, tr: x.tr, en: x.en, pic: numeral(x.n), clip: 'num/' + x.n })) });
  return pages;
}
const roomFull = r => { const p = albumPages().find(x => x.key === 'room-' + r); return !!p && p.tiles.every(t => S.found.has(t.key)); };
function albumShow(tr, en) { $('albumword').textContent = tr; $('albumgloss').textContent = en || ''; }
function openAlbum() {
  if (S.busy) return;
  initAudio(); stopSound(); talk++;
  const grid = $('albumgrid'); grid.textContent = ''; let total = 0, have = 0;
  albumPages().forEach(page => {
    const box = document.createElement('div'); box.className = 'sec';
    const tile = (cls, pic, label, onTap) => { const b = document.createElement('button'); b.className = 'sticker ' + cls; b.innerHTML = pic; b.setAttribute('aria-label', label); b.onclick = () => onTap(b); box.append(b); return b; };
    tile('head', page.pic, page.tr, () => { albumShow(page.tr, page.en); say([page.clip]); }).id = 'page-' + page.key;
    let all = true;
    page.tiles.forEach(t => {
      const got = S.found.has(t.key); total++; if (got) have++; else all = false;
      tile(got ? '' : 'locked', t.pic, got ? t.tr : '?', b => {
        if (got) { albumShow(t.tr, t.en); say([t.clip]); } else { stopSound(); b.classList.add('wobble'); setTimeout(() => b.classList.remove('wobble'), 500); }   // a sticker she has not found yet stays a mystery
      }).id = 'st-' + t.key;
    });
    box.classList.toggle('full', all); grid.append(box);
  });
  $('albumcount').textContent = '⭐ ' + have + ' / ' + total;
  $('album').hidden = false; $('album').scrollTop = 0;
  const line = have === total ? 'allfound' : 'album'; albumShow(LINES[line][0], LINES[line][1]); say(['line/' + line]);
  if (have === total) confetti();
}
function closeAlbum() { stopSound(); talk++; $('album').hidden = true; }

function showTitle() {
  setMode('title'); S.busy = false; setRoom(null); resetPony('combed'); $('steps').textContent = ''; drawTag(S.names);
  show("Leyla'nın Midillisi", "Leyla's pony");
  shelf.textContent = '';
  shelf.append(bigButton(ICON_PLAY, 'Oyna', () => { initAudio(); if (S.names.length) showRooms(true); else startNaming(true); }));
}

function startNaming(first) {
  setMode('naming'); S.busy = false; S.picking = []; setRoom(null); drawTag([]); $('steps').textContent = ''; resetPony('combed');
  shelf.textContent = '';
  const ok = bigButton(ICON_OK, 'Tamam', confirmNames); ok.disabled = true; ok.id = 'ok';
  NAMES.forEach(n => {
    const b = document.createElement('button'); b.className = 'chip'; b.id = 'name-' + n.id; b.innerHTML = '<span>' + n.icon + '</span>' + n.show;
    b.onclick = () => {
      if (S.busy) return;
      const at = S.picking.indexOf(n.id);
      if (at >= 0) S.picking.splice(at, 1); else if (S.picking.length < MAX_NAMES) S.picking.push(n.id); else { b.classList.add('wobble'); setTimeout(() => b.classList.remove('wobble'), 500); }
      b.classList.toggle('on', S.picking.indexOf(n.id) >= 0);
      drawTag(S.picking); ok.disabled = !S.picking.length;
      show(S.picking.length ? S.picking.map(id => nameOf[id].show).join(' ') : LINES.who[0], S.picking.length ? '' : LINES.who[1]);
      hop(); say(['name/' + n.id]);
    };
    shelf.append(b);
  });
  shelf.append(ok);
  show(LINES.who[0], LINES.who[1]);
  say(first ? ['line/hello', 'line/who'] : ['line/who'], showLineFor);
}
async function confirmNames() {
  if (S.busy || !S.picking.length) return;
  S.busy = true; S.names = S.picking.slice(); saveNames(); drawTag(S.names); shelf.textContent = '';
  show('Benim adım ' + fullName() + '!', 'My name is ' + fullName() + '!');
  await say(['line/myname'].concat(S.names.map(id => 'name/' + id), ['line/funny']), id => { if (id.indexOf('name/') === 0) hop(); if (id === 'line/funny') { hop('twirl'); show(LINES.funny[0], LINES.funny[1]); } });
  showRooms(false);
}

// The four doors. Each one says its name when touched, then she goes in.
function showRooms(hello) {
  setMode('rooms'); S.busy = false; S.room = null; setRoom(null); resetPony('combed'); $('steps').textContent = ''; drawTag(S.names);
  shelf.textContent = '';
  ROOM_ORDER.forEach(id => {
    const b = document.createElement('button'); b.className = 'pick'; b.id = 'room-' + id; b.innerHTML = drawing(ROOMS[id].pic); b.setAttribute('aria-label', ROOMS[id].tr);
    b.onclick = async () => { if (S.busy) return; initAudio(); S.busy = true; b.classList.add('right'); show(ROOMS[id].tr, ROOMS[id].en); hop(); await say(['word/room-' + id]); startVisit(id); };
    if (roomFull(id)) b.classList.add('star');                       // every sticker of this room found
    shelf.append(b);
  });
  const book = bigButton(ICON_BOOK, 'Çıkartma defteri', openAlbum, true); book.id = 'book'; shelf.append(book);
  show(LINES.where[0], LINES.where[1]);
  say(hello ? ['line/hello', 'line/where'] : ['line/where'], showLineFor);
}

// How many pictures to choose from: two at the very start of a room, then three, and four once she has been there a few times.
function choicesFor(target) {
  const visit = S.visits[S.room] || 1, n = visit <= 1 ? (S.i < 3 ? 2 : 3) : visit >= 4 ? 4 : 3;
  const v = variantOf(target), c = countOf(target);
  // a colored thing is shown among its other colors, a counted thing among other amounts of itself, anything else among other things from the room
  const pool = v ? COLORS.map(k => v.base + '-' + k.id).filter(x => x !== target)
             : c ? [1, 2, 3, 4, 5].filter(k => k !== c.n).map(k => c.base + '-x' + k)
                 : ITEMS.filter(i => i.r === S.room).map(i => i.id).concat(BORROWED[S.room] || []).filter(x => x !== target && x !== TWIN[target]);
  return shuffle([target].concat(shuffle(pool).slice(0, n - 1)));
}
function drawSteps() { const el = $('steps'); el.textContent = ''; S.steps.forEach((s, i) => { const d = document.createElement('i'); d.className = i < S.i ? 'done' : i === S.i ? 'now' : ''; el.append(d); }); }

async function startVisit(room) {
  const R = ROOMS[room];
  setMode('visit'); S.busy = true; S.room = room; S.visits[room] = (S.visits[room] || 0) + 1; S.steps = R.plan(); S.i = 0; S.worn = 0; S.fresh = 0;
  setRoom(room); resetPony(R.mane); drawTag(S.names); drawSteps(); shelf.textContent = '';
  await sayLine(R.start);
  nextStep();
}
function ask() { const t = S.steps[S.i], inf = info(t); show(inf.tr + '!', inf.en); return say(['ask/' + t]); }
function nextStep() {
  if (S.i >= S.steps.length) { finale(); return; }
  S.wrong = 0; drawSteps(); shelf.textContent = '';
  choicesFor(S.steps[S.i]).forEach(id => {
    const b = document.createElement('button'); b.className = 'pick'; b.id = 'pick-' + id; b.innerHTML = drawing(id); b.setAttribute('aria-label', info(id).tr);
    b.onclick = () => choose(b, id); shelf.append(b);
  });
  S.busy = false; ask();
}
async function choose(btn, id) {
  if (S.busy || S.mode !== 'visit') return;
  S.busy = true;
  const R = ROOMS[S.room], target = S.steps[S.i], inf = info(id);
  show(inf.tr, inf.en);                                             // whatever she touches says its own name
  if (id !== target) {
    S.wrong++; btn.classList.add('wobble');
    await say(['word/' + id]); btn.classList.remove('wobble');
    if (S.wrong >= 2) { const right = $('pick-' + target); if (right) right.classList.add('hint'); }   // after two misses the right one glows
    if (S.wrong === 2) await sayLine('lookagain');
    S.busy = false; ask(); return;
  }
  btn.classList.add('right'); shelf.querySelectorAll('.pick').forEach(b => { b.disabled = true; b.classList.remove('hint'); });
  const spoken = say(['word/' + id]);
  await fly(btn, R.spot || 'headspot'); btn.style.visibility = 'hidden';
  const reaction = R.use(target, inf);
  mark(target);
  hop(); await spoken;
  if (R.act) await R.act(target);
  S.i++; drawSteps();
  if (S.i >= S.steps.length) { finale(); return; }                   // the last thing leads straight into the ending
  if (reaction) await sayLine(reaction);
  const more = R.after && R.after(target);
  if (more) await sayLine(more);
  nextStep();
}
async function finale() {
  const R = ROOMS[S.room];
  setMode('finale'); S.busy = true; shelf.textContent = ''; ride(false); confetti(); hop('twirl'); burst('spark');
  await sayLine(R.done);
  show(fullName() + '!', '');
  await say(S.names.map(id => 'name/' + id), () => hop());
  hop('twirl'); confetti();
  const fresh = S.fresh > 0;
  if (fresh) await sayLine('newsticker');
  shelf.append(bigButton(ICON_AGAIN, 'Tekrar oyna', () => { initAudio(); startVisit(S.room); }));
  const door = bigButton(ICON_DOOR, 'Başka oda', () => { initAudio(); showRooms(false); }, true); door.id = 'door'; shelf.append(door);
  const book = bigButton(ICON_BOOK, 'Çıkartma defteri', openAlbum, true); book.id = 'book'; if (fresh) book.classList.add('pulse'); shelf.append(book);
  S.busy = false; sayLine('again');
}

// Tapping the pony tickles her. Tapping her name tag lets Leyla rename her (not in the middle of a visit).
pony.addEventListener('click', () => {
  if (S.busy || (S.mode !== 'visit' && S.mode !== 'finale' && S.mode !== 'rooms')) return;
  hop(); const wasVisit = S.mode === 'visit';
  sayLine('tickle').then(ok => { if (ok && wasVisit && S.mode === 'visit' && !S.busy) ask(); });
});
$('tag').onclick = () => { if (S.busy || S.mode === 'visit' || S.mode === 'naming') return; initAudio(); startNaming(false); };
$('again').onclick = () => { initAudio(); if (S.busy || !S.last.length) return; if (S.mode === 'visit') ask(); else say(S.last); };
['pointerdown', 'keydown', 'touchend'].forEach(t => window.addEventListener(t, wake, true));
document.addEventListener('visibilitychange', () => { if (document.hidden) stopSound(); });

// The pool runs on past the edge of the picture, so on a wide tablet the water reaches the side of the screen.
$('water').setAttribute('d', 'M122 268 q14 -10 28 0' + ' t28 0'.repeat(70) + ' V900 H122 Z');

$('albumclose').onclick = closeAlbum;

S.names = loadNames(); S.found = loadFound();
showTitle();
window.__lm = { S, ROOMS, ROOM_ORDER, choose, startVisit, startNaming, showTitle, showRooms, finale, info, drawing, variantOf, countOf, albumPages, openAlbum, closeAlbum, mark, ITEMS, COLORS, NAMES, LINES, VARIANT, NUMBERS, COUNTED };   // handle for testing
})();
</script>
<script>
// Offline play: the service worker keeps every file of the game on the tablet after the first visit.
if ('serviceWorker' in navigator) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Offline play is not set up yet; the game still works online.', err));
  });
}
</script>
